    <link rel="stylesheet" href="assets/reskin.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
    /* hide the "지금 {diet}에 좋은 재료부터" hero header (user request) */
    (function(){
      function hide(){
        document.querySelectorAll('.section-head').forEach(function(h){
          var t = h.querySelector('.section-title');
          if(t && t.textContent.trim().indexOf('지금') === 0) h.style.display = 'none';
        });
      }
      hide();
      new MutationObserver(hide).observe(document.body, {childList:true, subtree:true});
    /* fnav widget: pin next to app column on wide screens (user request) */
    (function(){
      function fix(){
        var nav = document.querySelector('.fnav');
        if(!nav) return;
        var vw = window.innerWidth;
        if(vw <= 800) return;
        var targetLeft = (vw/2) + 200 + 12; /* center + half app width + gap */
        var cur = parseFloat(nav.style.left || '0');
        if(cur > targetLeft + 50) nav.style.left = targetLeft + 'px';
      }
      new MutationObserver(fix).observe(document.body, {childList:true, subtree:true});
      window.addEventListener('resize', fix);
      fix();
    })();
    </script>
  </body>
</html>
